name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain versions
        shell: pwsh
        run: |
          Write-Host "VCPKG_INSTALLATION_ROOT = $env:VCPKG_INSTALLATION_ROOT"
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Pin vcpkg manifest baseline
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner"
          }
          $sha = (git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          Write-Host "Using vcpkg HEAD $sha"
          $text = Get-Content vcpkg.json -Raw
          $text = $text -replace 'CHANGE_ME_TO_A_REAL_VCPKG_BASELINE_COMMIT', $sha
          Set-Content -Path vcpkg.json -Value $text -Encoding utf8 -NoNewline
          Write-Host "--- vcpkg.json ---"
          Get-Content vcpkg.json

      - name: Configure (CMake + vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset vcpkg

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse build -Include radmin_server.exe,radmin_client.exe |
            ForEach-Object { Copy-Item $_.FullName dist\ }
          Get-ChildItem dist

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: radminpro-windows-x64
          path: dist/*.exe
          if-no-files-found: error
